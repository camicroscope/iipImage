<IfModule mod_fcgid.c>
  FcgidConnectTimeout 20

# Create a directory for the iipsrv binary
ScriptAlias /fcgi-bin/ "/var/www/localhost/fcgi-bin/"


  <IfModule mod_mime.c>
  # Set the options on that directory
<Directory "/var/www/localhost/fcgi-bin/">
   AllowOverride None
   Options None
   Order allow,deny
   Allow from all

   # Set the module handler
   AddHandler fcgid-script .fcgi
</Directory>

# Set our environment variables for the IIP server
FcgidInitialEnv VERBOSITY "1"
FcgidInitialEnv LOGFILE "/tmp/iipsrv.log"
FcgidInitialEnv MAX_IMAGE_CACHE_SIZE "512"
FcgidInitialEnv JPEG_QUALITY "75"
FcgidInitialEnv MAX_CVT "5000"
# FILESYSTEM_PREFIX jails FIF/IIIF paths under a single directory. It is off
# here because caMicroscope Distro addresses slides by absolute path: PathDB
# stores them in node__field_iip_path as e.g.
#   /data/images/ross/APOLLO/APOLLO2/AP-2WDT-59.svs
# and the compose file mounts the image trees at /data/images/. Any non-empty
# prefix is prepended to an already-absolute path, producing
# "/images//data/images/..." and a 404 for every slide.
#
# Main.cc refuses to start on an empty prefix unless ALLOW_UNJAILED_FILESYSTEM
# is set, so this is a deliberate, visible opt-out rather than a silent one.
#
# The trade-off is real. Unjailed, a caller who can reach this server can ask
# it to open any file the process can read. iipsrv has no authentication of its
# own, so it must stay behind the back/caracal service and must never be given
# a ports: mapping of its own.
#
# To restore the jail: point FILESYSTEM_PREFIX at the image root, store slide
# paths relative to it, and drop ALLOW_UNJAILED_FILESYSTEM.
#FcgidInitialEnv FILESYSTEM_PREFIX "/images/"
FcgidInitialEnv ALLOW_UNJAILED_FILESYSTEM "true"
FcgidInitialEnv LD_LIBRARY_PATH "/usr/local/lib"
FcgidInitialEnv MAX_TILE_CACHE_SIZE "64"
FcgidInitialEnv CORS "*"
FcgidInitialEnv BFBRIDGE_CACHEDIR "/tmp/"
FcgidInitialEnv BFBRIDGE_CLASSPATH "/usr/lib/java"
FcgidInitialEnv BFBRIDGE_LOGLEVEL "WARN"

# Define the idle timeout as unlimited and the number of
# processes we want
FcgidIdleTimeout 0
FcgidMaxProcessesPerClass 16


  </IfModule>
</IfModule>
